<!doctype html>
<html lang="{{lang}}" data-analytics="{{analytics}}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{fullTitle}}</title>
  <meta name="description" content="{{description}}">
  <meta name="robots" content="{{robots}}">
<!--HEAD-->
  <meta name="theme-color" content="#142e7a">
  <meta name="color-scheme" content="light dark">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="{{locale}}">
  <meta property="og:site_name" content="{{name}}">
  <meta property="og:title" content="{{fullTitle}}">
  <meta property="og:description" content="{{description}}">
  <meta property="og:url" content="{{canonical}}">
  <meta property="og:image" content="{{ogImage}}">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:type" content="image/jpeg">
  <meta property="og:image:alt" content="{{t.og_alt}}">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{{fullTitle}}">
  <meta name="twitter:description" content="{{description}}">
  <meta name="twitter:image" content="{{ogImage}}">
  <meta name="twitter:image:alt" content="{{t.og_alt}}">
  <link rel="icon" href="/favicon.ico" sizes="32x32">
  <link rel="icon" href="{{asset:/assets/favicon.svg}}" type="image/svg+xml">
  <link rel="apple-touch-icon" href="{{asset:/assets/apple-touch-icon.png}}">
  <link rel="manifest" href="/site.webmanifest">
  <link rel="preload" href="{{asset:/assets/fonts/baloo2.woff2}}" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="{{asset:/assets/fonts/nunito.woff2}}" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="{{asset:/assets/site.css}}">
  <script src="{{asset:/assets/site.js}}" defer></script>
</head>
<body>
  <a class="skip-link" href="#icerik">{{t.skip}}</a>
  {{> header}}
  <main id="icerik" tabindex="-1">
<!--CONTENT-->
  </main>
  {{> footer}}
  {{> consent}}
</body>
</html>
