<section class="consent" id="consent" aria-labelledby="consent-title" hidden>
    <div class="consent-inner">
      <h2 id="consent-title" class="consent-title">{{t.consent_title}}</h2>
      <p>{{t.consent_text}} <a href="{{link:cookies}}">{{t.consent_more}}</a></p>
      <div class="consent-actions">
        <button type="button" class="btn btn-secondary" data-consent="reject">{{t.consent_reject}}</button>
        <button type="button" class="btn btn-secondary" data-consent="accept">{{t.consent_accept}}</button>
      </div>
    </div>
  </section>
